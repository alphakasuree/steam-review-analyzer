레퀘를 예전에 한번 해봤기에, 두번째라 빠르게 진행되서 다시 모그윈 왕조에 도달하자 본격적으로 룬노가다로 렙업에 속도가 붙기 시작했으며, 광렙업후 빠르게 체크리스트의 보스들을 격파해 나갔습니다.\n\n114개의 체크리스트를 매우 천천히 하나씩 지우며 진행도를 1%~2%씩 올리고 있다가 마술학원의 레날라를 격파하며 게임의 흐름을 완전히 꿰뚫는 깨달음의 순간이 찾아왔고, 그날을 기점으로 제 진행 속도는 놀라울 만큼 빨라졌습니다. 뭔가 이런식으로 진행하면 되는구나? 하는 느낌이 왔고 바로 다음날부터 패드를 몇시간이고 잡고 있다가 별 부수는 라단까지 단숨에 물리치며 2일 연속으로 데미갓을 잡으니까 자신감이 붙기 시작했습니다. 그리고 마침 다음날이 쉬는 날이었는데, 별방울의 화신을 얻으면서 보스들을 미친듯이 잡아내기 시작했습니다. 점성술사인지라, 탱커가 생기자 뒤에서 폭딜을 때려넣을수 있었고 하루만에 진행도를 50%에서 90%까지 끌어올리는 폭풍 같은 질주를 이어갔으며, 쭉쭉 밀고 나가며 자신감이 붙었습니다.\n\n그러다가 엄청난 고비가 왔는데 두명의 살갗... 여기서 고전을 한뒤, 그 다음 보스로 흑검 말리케스를 보았는데 너무 어려웠습니다. 2페만 가면 죽어버리는 통에 뭘 할수가 없더라구요. \"나를 두려워하라, 흑검 말리케스를\"이라는 죽으면 나오는 음성만 계속 들으며 빡쳐했습니다. 근데 계속 죽으면서도 패드를 쥐고 들이대기 시작했습니다. 그래서 무려 화장실도 가지 않고 8시간을 넘게패드를 잡고 매달린 끝에 승리를 거두었을 때는 정말 새벽에 너무 기쁘더라구요 ㅎㅎ\n\n말리케스 뒤에는 뭐가 있는지 몰라서 잠들었고, 뒤에 기드온과 호라 루, 최종 보스 3명만 잡으면 엔딩이라는 말에 말리케스 잡은 다음날 트라이 시작했습니다. 그리고 기드온과 호라 루를 각각 3트 만에 물리치길래, 말리케스 뒤에는 순조롭구나? 오늘 엔딩보는건가? 하고 최종보스를 마주했는데... 오우야 ㅎㅎ....\n\n최종 보스 엔디의 짐승은 6시간의 사투해도 끝이 보일 생각을 안했습니다. 1페도 못넘기는게 대부분이었고, 2시간 넘게 트라이 끝에 2페를 갔는데 2페 갈때는 이미 물약들이 모두 소진한 뒤라 잡힐 기미가 보이지 않았습니다. 그리고 매번 2페 가는것도 아니고, 몇번씩 트라이 하면 한번 겨우 가는 정도?... 그래서 엔딩은 못볼수도 있겠다는 생각이 들더라구요.\n\n(2번째 트라이 죽었을때)\n그리고 다음 날 일하면서 짬짬히 공략들 보면서 1페이즈 피하는 방법등을 다지고, 2페에서 요령을 미리 봐둔뒤 퇴근 후 밤 11시 반에 마음을 비우고 다시 도전했을 때, 2트 만에 보스의 체력을 7%까지 깎는 것을 보며 오늘 자기는 다 틀렸구나 어떻게든 잡아보자 하며 헤딩각오하고 가볍게 3트에 들어갔는데 갑자기 2트보다 모든 상황이 좋게 풀리더니 마침내 엘데의 짐승을 쓰러뜨리는 데 성공했습니다. 돌이켜보니 레날라 격파 이후 거의 6일동안 엄청 몰입해서 엔딩까지 마구 달렸네요.\n\n저는 평소에 겁이 좀 많은 편이고, 그래서 게임을 새로 고를때 걱정,편견,생각이 많습니다. 다크소울3도 정작 구매해서 해야지해야지 하면서 10년째 실행도 못해보고, 미루기만했는데 이번에 엘든링 엔딩을 보고나니, 어렵다는 편견에 갇혀있던게 후회스럽습니다. 어렵다는 편견과 막연한 두려움에 플레이를 망설이며 미뤄왔지만, 막상 그 고비를 넘어서 마주한 황금나무의 끝은 그동안의 기다림을 단번에 보상받고도 남을 만큼 가슴 벅찬 성취감을 안겨주었습니다.\n\n작년 갓오브워4를 깨고 큰 감동을 받아 플스하면서 역대 제일 재미있었던 게임을 라오어,갓오브워,페르소나 3개를 꼽곤 했습니다. 근데 그 3개를 모두 넘어서는 제 인생 최고의 게임중 하나가 되었습니다. 평점 10/10을 주고 싶네요. 앞으로도 소울게임들 많이 플레이 해보고 싶네요.", "안해보면 인생 손해봄.", "너무 재밌는데\n너무 어려워요\n살려줘", "평소에 게임이나 취미 활동을 할 시간이 많아서 자주 하는데 여태까지 한 게임중에 가장 재미있는것 같습니", "뭐랄까.. 복잡해요.. 열 받아서 다 죽여버리고 싶은데 그렇게 못 해요.", " 의지가 틈새의 땅에서 목적을 달성하면 틈새의 땅 생명체들은 전부 노란불로 녹여 신에게 흡수되리.\n\n그녀는 위대한 의지의 영원한 지배와 감시에서 벗어나기 위해 세 가지 카드를 준비한다.\n하나는 뿔인간들을 숙청하기 위해 스스로 창조한 자식 '가시공 메스메르'\n둘쨰는 훗날 황금나무를 불태워 신의 통제를 끊어낼 불씨로 삼은 자식 '멜리나'\n마지막은 그녀의 반려, 왕 고드프리와 전사들을 위대한 의지의 감시와 통제로부터 벗어나게 하기 위해 축복을 빼앗아 틈새의 땅 밖으로 밀어냈다.\n훗날 그들이 더 강해지고 돌아와 새로운 질서를 만들 불씨가 되도록.\n그리고 거인의 불의잔에서 빛바랜자(주인공)를 도와 황금나무를 불태우도록 멜리나에게 사명을 남겨둔다.\n\n마지막으로 그녀는 사랑하는 자식 황금의 고드윈을 운명의 죽음으로 완전히 죽여 엘든링의 통제와 감시로부터 자유롭게 만들고 다시 부활시키기 위해 자신의 직속부대인 검은칼날들에게 고드윈을 죽이라고 명령한다.\n고드윈은 자신을 찾아온 어머니의 직속부대를 보고 어머니의 의도를 알게되고 저항하지 않고 그 의식을 받아들인다.\n\n그런데 하필 마녀 라니가 위대한 의지의 메신저, 두손가락들의 감시와 통제를 벗어나기 위해 고드윈에게 쓰여졌어야할 죽음의 룬 일부를 훔쳤고 그 사단으로 고드윈은 불완전하게 죽어 죽음에 사는 왕자가 되었다.\n고드윈은 영혼이 죽고 육신은 살아남아 환경에 맞춰 끊임없이 증식한다.\n\n변수가 생겼지만 마리카는 계획을 실행한다.\n그녀는 엘든링을 부수고 자식들에게 '인간들을 위한 새로운 규율'을 만들라고 명령한다.\n그러나 데미갓들은 저마다 생각이 달랐고 심지어 거대한 룬의 힘에 매료되어 내전(파쇄전쟁)을 일으킨다.\n\n그래서 다시 처음의 질문으로 돌아온다.\n\n'마리카는 왜 엘든링을 부쉈는가?'\n\n마리카는 신의 규율이 아닌 인간 자신들의 의지로 새 시대를 정의하고 규율을 세우길 원했다.\n플레이어의 입장에서 느껴지듯 단순히 왕이 되어 부귀와 권세를 누리고 싶어할 '욕망 따위' 로는 도저히 할 수 없는 일이기에\n이런 고행을 끝까지 걸어간 자만이 새로운 시대를 정의할 자격을 얻으며\n신의 꼭두각시 노릇을 거부하고 세상을 인간의 손에 돌려주기 위한 실존주의적 '인간 찬가' 의 의미가 있다고 생각한다.\n말하자면 \"세상의 주인은 더 이상 보이지 않는 신이 아니라, 이 고통스러운 땅을 직접 딛고 선 너희들이다.\" 라는 메세지일 것이다.\n그래서 마리카는 엘든링을 부쉈고\n망가진 세상을 내 손으로 바로잡겠다는 숭고한 책임감, 꺾이지 않는 마음에 도박을 걸었다.", "4K 풀옵 걸어도 쓰레기 그래픽을, 5090으로도 60프레임 겨우 유지하는데 부하100% 찍네. 최적화도 쓰레기. 옵션이라도 낮춰서 고주사율로 하려 했더니 60프레임 제한이네?", "엘든링 나올 것 같애", "진짜 한 4~5시간까지는 뭐해야 하는지 모르겠다가 밀키트부터 재미느끼고 달리고있는데 시간나면 2회차엔 마법사할듯함", "모그원 왕조에 사랑 있으라", "ELDEN RING IS SCHOLAR", "소울류 게임을 해본적이 없어서 어려울 거라고 겁먹고 있었는데 진작에 해볼걸 그랬어요 dlc까지 구매할 용의가 있습니다", "토사물", "엘든링은 내가 처음으로 접해본 소울류 게임이다\n물론 이전에도 소울라이크 태그가 붙은 메트로베니아 게임은 많이 해봤지만, 흔히 말하는 프롬 게임과는 조금 거리가 있었다. 오랜만에 진득하게 해볼 오픈월드 알피지가 필요했는데. 이전에 샀다가 트리가드 못잡아서 환불한 엘든링이 생각나서 해봤다 \n\n처음 배움의 동굴에서 벗어나면 아름다운 절경의 림그레이브가 나를 맞이해준다. 황금 나무에서 따스한 햇살이 내리쬐고. 잔디가 반짝이며 멀리서 뛰노는 사슴과 병사들이 눈에 들어온다. 내 게임 평가의 대부분에 들어가는 문장이지만, 정말 미지의 세계를 모험하는 것은 게임으로 경험할 수 있는것들 중 최고가 아닐까 싶다. m을 누르면 펼쳐지는 광활한 지도와 아직 지도 조각조차 찾지 못한 지역들은 나를 설레게 만든다. \n\n멀기트를 만났을때가 첫 고난이었다. 물론 잡몹들도 엇박이 없었던건 아니지만, 이녀석의 경우 덩치도 큰것이 자꾸 때릴까말까와 투척나이프를 시전해서 골치아프게 만들었다. 두번째 고비는 다대일 상황, 머리3개달린 조각상 (이름기억안남)이 아마 내 진행에서 가장 먼저 만난 다대일 보스가 아닐까 싶은데, 임프도 많은데다가 패턴도 모션을 도통 알아챌수가 없어서 힘들었던 기억이 난다. 보통 이런건 싱글 게임이라서 눈물을 머금으며 하나씩 다대일을 헤쳐나가는게 정석인데, 엘든링의 경우 영체를 통해 나도 똑같은 다대일을 시전할 수 있다는게 정말 좋은 요소였다고 생각한다 \n\n이어서 리에니에 호수에 도달하고, 레아 루카리아를 뒤엎고 다니며 길을 찾기 시작했을 때, 이때부터 인터넷에서 공략을 뒤져보기 시작했다. 너무 넓으니까 물론 좋기도 하지만 메인 보스나 좋은 아이템을 향해 가는 길이 궁금하기도 하고, 정체불명의 가능성으로 가득찬 지붕길을 얼마나 가야 화톳불이 나올지 내가 알수가 없으니, 그리고 아니나다를까 숨겨진 템이 되게 많았어서 네다섯번은 왔다갔다 한 것 같다. 그래도 찾아보면서라도 맵을 샅샅히 파헤치는것 또한 정말 즐거웠다\n\n이렇게 학원을 마스터하고, 몬 성과 케일리드를 지나 적사자성에 도달했을 때, 라단 축제를 맞이하게 되었다. 보스전에서 동료들을 소환할 수 있다는건 생각도 못한채 두 시간동안 패턴 타이밍을 연구하며 혼자서 때려잡았는데, 라단은 정말 잘 만든 보스인것같다. 정말 잘 만든 보스는 어렵더라도 이상하게 화가 안나고 도전욕구를 일으키는데, 나에게는 라단과 말레니아가 그랬다. \n\n물론 엉성하고 괘씸한 녀석들도 많았다. 그냥 복붙해둔것같은 나무보스들과 비룡, 1대1도 힘든데 둘이 한꺼번에 오는 도가니 듀오까지 내 멘탈을 흔들어 왔다. 근데, 이게 사람이 보스 잡느라 피폐해졌을 때, 그 수시간의 노력이  ENEMY FELLED 라는 문구와 축복으로 보답을 받았을때, 낮은 도파민 수치에 익숙해져있던 뇌가 얻는 그 기쁨은 정말 상상을 초월한다. 고난이도 게임을 해보지 않은 사람은 평생 느껴보지 못할 마약같은 재미이다. 이래서 소울라이크 게임을 하는구나.. 생각한 계기였다\n\n알터고원 대승강기와 밀리센트 퀘스트를 진행하며 생각이 든건데, 넓은 세계관에 비해 스토리나 퀘스트 설명이 너무 적다. 물론 여기저기서 스토리 조각을 모아 짜맞추는 재미는 알겠는데, 그걸로는 부족하다. 나는 스토리 떡밥과 서론 결론 서사를 모두 이해하고 남에게 설명해줄 수 있는 그런 경지에서 엔딩을 보기를 원했는데, 그때까지 인물간의 대략적인 관계와 흐름만을 이해한 채 정확히 무슨 일이 있었는지는 완벽히 파악하지 못했다. 퀘스트 또한 npc가 나한테 말도 안하고 자꾸 여기저기로 여행을 다닌다. 특히 동굴 가장 깊은곳이나 '이 너머 강적 있다' 이후에 등장하는 NPC들은 이새끼들은 대체 여기까지 어떻게 온거야 라는 생각이 든다. \n\n이후엔 이런 여정의 반복이다. 이틀에 걸쳐 말레니아를 잡고, 아름다운 도읍 로데일을 구경하기도 하고, 화산관에 가서 데미갓 라이커드 (그냥 꽈리 튼 뱀이라 차가운 긴이빨로 2연속베기 무한연타로 잡아서 좀 실망했다)를 죽이고, 이윽고 모든 보스를 처치한 후 산령에 가서 황금 나무를 불태운다.\n\n지금까지 플레이어의 목표이자 이정표가 되었던 황금 나무가 불타는걸 보니 기분이 묘해졌다. 지금까지 날 인도해주었던 존재를 내가 엘데의 왕이 되기 위해 불태운다라.. \n근데 불타는건 황금 나무뿐만이 아니었다... 내 집과 지금까지의 여정을 도와온 NPC들이 비참하고 절망적인 결말을 맺는걸 보니 마음이 텁텁해졌지만, 그래서라도 내가 엘데의 왕이 되어 이들을 구원하리라는 마음으로 계속 나아갔고, 최종보스를 직면했다.\n\n근데 라다곤 이샛기가 문제였다\n아무리 엇박의 대명사 엘든링이라곤 하지만 엇박의 엇엇박 엇엇엇박 눈깔빔을 하루종일 당하니까 사람이 화가 날수밖에 없더라. 결국 1페이즈 화신의 물방울로 같이 뚜까패고, 2페이즈 엘데의 짐승만 패턴 마스터해서 \n연인 라니와 함께 별의세기 엔딩을 보는것으로 엘든링의 여정은 끝나게 된다 \n\n엘든링의 고평가받는 이유는 물론 정통적인 소울라  _)\n\n\n[스토리]\n\n틈새의 땅을 지배하던 영원의 여왕 마리카는 모종의 사건으로 인해 틈새의 땅 모든 법칙의 근원이던 엘든 링을 파괴한다. 산산이 부서진 엘든 링은 여러 개의 파편으로 나뉘었고, 이 파편들은 거대한 룬이라 불리며 마리카의 자손인 데미갓들이 나눠가지게 된다.\n\n한편, 엘든 링에 담긴 여왕 마리카의 규율, 즉 황금률을 유지하고자 하는 존재인 \"두 손가락\"들은 거대한 룬을 두 개 이상 모은 데미갓은 왕의 자격을 얻으며, 적격자가 황금 나무에 입성하면 왕이 될 수 있다\"는 전언을 퍼트린다. 그렇게 전언을 들은 데미갓들은 동시에 서로가 왕의 자리를 차지하기 위해 전쟁을 벌이기 시작한다. 그렇게 시작된 반신들의 싸움은 점점 격화되었고, 결국 틈새의 땅 전역을 집어삼킨 대규모 전쟁, 파쇄전쟁으로 이어진다. 이에 황금률을 되살릴 새로운 가능성을 찾던 두 손가락은, 과거 황금의 축복을 잃고 추방되었던 자들 \"빛 바랜 자\"들을 다시 틈새의 땅으로 불러들이기로 결정한다.\n\n그렇게 축복의 인도에 이끌려 돌아온 한 명의 빛 바랜 자는, 왕을 기다리는 예배당에서 조용히 눈을 뜨는데..\n\n\n[게임 특징]\n\n장점\n\n[u][b]1. 탐험과 파밍으로 극복했던 난관의 벽[/b][/u]\n\n전작인 다크 소울 3를 플레이 할 때를 떠올려보면 진행이 막히는 순간은 늘 고통스러웠다. 낙사 유도 구간, 필드의 강력한 엘리트 몬스터, 보스전 등 참 다양한 곳에서 유다희양을 많이도 만났다. 그럴 때마다 특정 구간에서 노가다를 해 레벨을 올리거나, 공략을 참고하거나, 혹은 게임을 끄고 머리를 식혀 다음 날에 다시 도전하는 식으로 헤쳐나갔다. 이는 필연적으로 반복적인 트라이가 필요했고, 그에 따른 스트레스도 상당히 많이 받았다. 이 스트레스 때문에 다크 소울3를 2번을 유기했을 정도니 말이다. \n\n하지만 엘든 링에서는 오픈 월드라는 요소를 통해 이 문제를 어느 정도 해소해냈다고 느꼈다. 초반부터 얻을 수 있는 영마 토렌트를 통한 빠른 기동성과 지도를 통한 축복간의 빠른 이동을 통해 진행해왔던 필드를 되짚어 보거나, 아예 가보지 않은 다른 지역을 찾아가 다양한 갈래의 스펙업을 도모할 수 있기 때문. 지도 곳곳에 배치된 교회, 요새, 갱도, 묘지 등을 탐험하며 얻은 룬으로 레벨 업을 하고, 새로운 영체와 장비를 얻고, 성배병의 성능과 개수를 강화하는 등 이 과정에서 얻는 보상들을 통해 막혔던 부분을 무난하게 돌파가 가능했다.\n\n실제로 필자도 초반에 멀키트에게 대차게 깨진 후, 흐느낌의 반도에서 성장 후 다시 도전하여 1트만에 설욕에 성공했다. 악명 높은 영웅의 가고일 듀오 보스 역시 도읍 로데일을 먼저 밀어 스펙을 조금 더 올리고, 영체를 불러 클리어했다. 이처럼 소울라이크 장르의 진입 장벽이라 불리는 잦은 죽음에 대한 피로도를 낮추고, 탐사의 보상을 통해 재미를 느끼고, 최종적으로는 막혔던 부분도 돌파하게 되는 이 사이클이 너무 만족스럽고 재밌게 다가왔다.\n\n여기에 필드를 탐사할 때, 편의성 측면에서도 한층 편한 플레이를 만들어주는 장치들이 상당히 도움이 많이 됐다. 축복처럼 앉아서 쉴 수는 없지만, 적용 구역 내에서 사망했을 경우 세이브 포인트 역할을 하는 마리카의 쐐기, 필드나 던전 탐험 중 성배병의 횟수를 충전시켜주는 붉은 쇠똥구리 등 탐사를 도와주는 소소한 시스템들 덕분에 위험한 순간들을 여럿 넘겨 게임을 오래 붙잡을 수 있는 원동력이 되어줬다.\n\n[u][b]2. 무궁무진한 전투 빌드[/b][/u]\n\n엘든 링에서는 탐험을 통해 얻은 다양한 무기, 탈리스만, 전회 등을 활용해 다채로운 빌드 구축이 가능하다. 특히 이번에 실용적인 주문들이 다수 추가되어 근거리 빌드뿐 아니라, 원거리 빌드 또한 초반부터 사용이 가능하다. 과거 소울 시리즈에서는 보조 수단이나 예능의 영역에 머물렀던 주문이, 이번 작에서는 근접 빌드와 대등하거나 그 이상의 효율을 보여주는 주력 빌드로 당당히 자리 잡았다는 것도 눈여겨볼 만하다.\n\n평가를 작성하는 현 시점 기준으로는 이미 본편은 출시 4년차, DLC 또한 발매된 지 1년이 지났기 때문에 축적된 빌드 데이터는 그야말로 방대하다. 오죽하면 빌드만을 모아놓은 사이트가 있을 정도. 그만큼 양이 방대하기 때문에 엘든링 빌드라고만 검색해봐도 우후죽순 다양하고 재밌어 보이는 빌드들을 쉽게 접할 수 있다.\n\n출시 초기에 많은 인기를 끌어 모았던 밤과 불꽃의 검 빌드부터 필자가 애용한 출혈 빌드, 압도적인 그로기 수치로 적을 찍어 누르는 사자 베기 + 그레이트 소드 빌드, 그리고 보스를 순식간에 증발시키는 혜성 아줄 빌드까지. 실용성이 높으면서 재미까지 볼 수 있는 다양한 빌드가 많아 플레이 경험을 더 다채롭게 가져갈 수 있다. 무엇보다 1회차부터 스탯 초기화 기회가 꽤 넉넉하게 주어지기 때문에, 마음에 들지 않거나 질리면 언제든지 갈아탈 수 있어 다양한 플레이 스타일을 가져가려고 한다면 큰 장점으로 다가온다.\n\n[u][b]3. 소울 초보자들을 위한 구원 투수, 영체[/b][/u]\n\n이번 작품의 전투에서 가장 크게 체감하고 큰 장점으로 다가왔던 건 아무래도 영체 시스템이다. 전작 다크 소울 3에서는 특정 조건 하에 보스전에서 NPC나 다른 플레이어를 소환하는 방식이 전부였으나, 엘든 링에서는 보스전은 물론, 일부 까다로운 필드 구간에서도 영체 소환이 가능해 영체가 개입할 수 있는 순간이 굉장히 많다.\n\n때문에 다양한 영체를 수집하고 강화하는 과정 자체도 하나의 성장 축으로 작동한다. 영체는 보스의 어그로를 분산시켜 플레이어에게 정비할 시간과 공격 타이밍을 벌어주고, 동시에 같이 딜을 넣어주기 때문에 게임의 난이도를 눈에 띄게 낮춰준다. 특히, 플레이어의 스펙을 그대로 복제해 전회까지 난사하는 화신의 물방울이나, 적의 최대 체력을 깎아버리는 검은 칼날 티시와 같은 고성능 영체를 획득하는 순간부터는 소울 라이크 장르가 맞나 싶을 정도로 난이도가 일순간에 쾌적해진다.\n\n결과적으로 영체 시스템은 소울라이크 특유의 매운맛에 익숙치 않은 입문자들에게는 든든한 구원 투수와 같은 존재다. 필자 또한 덕을 많이 봤으며, 이 시스템 하나만으로도 엘든 링은 소울라이크 입문자들도 충분히 즐겨볼 만하지 않을까란 생각이 든다.\n\n[u][b]4. 보다 더 장엄해진 맵, 화려해진 비주얼[/b][/u]\n\n프롬 소프트웨어의 게임들에서는 언제나 진한 다크 판타지 향이나는 다양한 맵을 만날 수 있다. 이번 엘든 링에서의 다양한 맵 역시 상당히 만족스러웠다. 림그레이브의 황금 나무를 시작으로, 자욱한 안개가 신비로움을 더하는 리에니에 호수, 붉은 하늘 아래 기괴함이 잔뜩 있는 케일리드, 그리고 지하 세계라고는 믿을 수 없을 정도로 아름다운 은하수가 특징인 시프라강까지. 맵 곳곳이 저마다의 특색있는 테마로 완벽하게 구현되어 있어 탐험하는 내내 눈을 뗄 수 없었다.\n\n이런 맵들의 비주얼도 당연히 좋지만, 무엇보다 가장 인상적인 변화는 마법과 전투 기술의 연출이 비약적으로 화려해졌다는 점이다. 보스들만이 구사하던 화려한 스케일의 공격들을, 이제는 플레이어 또한 마음껏 구사하며 멋진 전투를 펼칠 수 있게 되었다. \n\n붉은 번개를 내리꽂거나, 중력을 조작해 적을 끌어당기거나, 하늘에서 거대한 운석을 소환하는 등 절로 가슴이 웅장해져 내가 알던 짠내 나던 소울 시리즈 주인공이 맞나? 싶은 감탄이 절로 나온다. 다크 판타지라는 정체성에서 맵에서는 '다크'를 강조하고, 마법과 전투 기술 부분에서는 '판타지'에 확실히 힘을 실어준 느낌이랄까. 덕분에 전투를 치르거나 새로운 맵에 입장할 때마다 눈과 손이 모두 즐거웠다.\n\n\n단점\n\n[u][b]1. 공략없이 완료하기 힘든 서브 퀘스트[/b][/u]\n\n다크 소울 3를 플레이할 때도 느꼈지만, 프롬 소프트웨어의 서브 퀘스트가 친절이라는 키워드와 거리가 멀다는 사실은 익히 알고 있었다. 이번 작 또한 불친절함은 여전했는데, 오픈 월드라는 요소와 만나 역효과가 마저 불러 일으켰다.\n\n게임 초반, D가 짐승 사제 그랭을 소개해 주며 지도에 붉은 마커를 딱 찍어주었을 때는 충격이었다. 아니, 나도 이제 공략 없이 서브 퀘스트를 완료할 수 있는 건가? 라는 마음이 들었기 때문이다. 하지만 아쉽게도 엘든 링 또한 여전히 NPC들의 행방을 찾기는 힘들었다. 더군다나 엘든 링은 플레이어가 발길 닿는 대로 갈 수 있는 오픈 월드다. 어디에 있는 지 단서도 안 쥐어주는 NPC를 찾기 위해 그 넓은 땅을 일일이 뒤지는 것은 모래사장에서 바늘을 찾는거나 다름없게 느껴졌다.\n\n그래서 개인적으로는 진행 중인 서브 퀘스트에 대한 최소한의 기록이 남았으면 하는 바람이 있다. 물론 화면 한구석에 퀘스트 목록이 주르르 다 뜨는 흔한 MMORPG 방식이 가장 무난할 것이다. 하지만 그런 UI는 프롬 게임만의 특유의 정체성을 해칠 것 같은 기분이 든다. 그렇다면 차라리 NPC와 대화를 마쳤을 때, 낡은 양피지같은 아이템 형식으로라도 대화의 단서를 다시 확인할 수 있게 해주면 어땠을까.\n\n마치 이번 작에서 방랑 상인들이 판매하던 정보 아이템들처럼 말이다. 개인적으로 이 정보들을 구매해서 읽어보는 재미가 쏠쏠했는데, 비스무리하게 가져간다면 딥한 세계관의 몰입감을 해치지 않으면서도, 유저의 편의성까지 약간은 잡을 수 있는 현명한 타협점이 될 수 있을 것 같다는 생각이 들었다.\n\n[u][b]2. 불편한 락 온, 카메라 시점[/b][/u]\n\n엘든 링의 적들은 인간형부터 압도적인 크기의 괴수까지 다양하다. 어떤 크기의 적이든간에 필자는 보통 전투 시작과 동시에 습관적으로 락 온을 거는데, 상대가 거대 몬스터일 경우에는 오히려 락 온을 하는 게 독이 됐다고 말할 수 있을 정도로 답답한 상황이 많이 연출됐다.\n\n괴수라고 말할 수 있을 정도로 거대한 크기의 적과 전투를 할 때는 락 온을 걸 수 있는 부분이 꽤 많다. 다리, 손, 몸통, 머리 등 아마 그로기에 걸렸을 때 조금 더 히트를 하기 쉽게 하려는 의도가 아닐까 싶다. 다만 거대 보스전에서 움직이다 보면 락 온을 건 부위가 의도치 않은 부위로 튀어버린다. 캐릭터를 움직이거나, 시야를 바로 잡기 위해 카메라를 돌렸을 뿐인데 타겟이 바꼈으니 이를 수동적으로 다시 고쳐줘야 한다. 물론 이게 한 번이 아니고 꽤나 지속적으로 발생한다는 게 흠. 특히 이 문제점은 다수의 잡몹과의 전투에서도 빈번히 발생하는 문제다.\n\n또, 어쩔 때는 좁은 지형에서 덩치 큰 보스와의 전투가 있을 때도 있다. 이럴 때 카메라 워킹은 재앙에 가깝다. 덩치 큰 친구가 이리 저리 움직일 때마다 카메라도 휙휙 바뀌니 상당히 어지럽고, 어쩌다가 특정 공간에 딱 껴버리는 상황도 나온다. 이럴 때 탈출하려고 아둥바둥을 치는데, 그럴 때마다 카메라가 뜬금없이 플레이어의 얼굴을 클로즈업해 버린다. 그러다 보니 시야 정보는 더 차단이 되버리니 이 상태에서 두들겨 맞다 보면 결국 유다희양을 만나게 되고, 억까를 당했다는 심정에 짜증이 치밀어 오른다.\n\n거대한 보스가 주는 위압감은 좋지만, 카메라와 씨름하느라 그 웅장함을 제대로 즐길 수 없으니 결과적으로 좋은 경험으로 남기는 힘들었다. 개인적으로는 덩치가 산만 한 적들과 전투할 때는 카메라 시야를 조금이라도 더 넓게 잡아주고, 좁은 공간에 갇히면 카메라 시점을 위로 빼 뭐에 낑겼는지를 보여주면 훨씬 나은 전투가 되지 않을까 하는 아쉬움이 남는다.\n\n\n[가격]\n\n정가는 64,800원이며, 필자는 30% 할인된 45,360원에 구매했다. AAA급 게임답게 가격대는 높은 편이지만, 장점 파트에서 언급했듯 다양한 빌드 구성과 프롬 소프트웨어 특유의 다회차 시스템 덕분에 가성비는 상당히 뛰어난 편이다. 유튜브에 다양한 빌드, 모드, 제약 플레이로 영상 콘텐츠가 4년이 지난 현재까지도 꾸준히 나오는 걸 보면 이 점을 확실히 알 수 있다.\n\n필자의 경우 1회차를 약 50시간 정도 즐기고 마무리했는데, 많은 유저들이 꼽는 림그레이브와의 첫 조우, 맵 곳곳을 탐험하며 장비, 보스, 축복을 발견했을 때의 즐거움, 그리고 소울라이크 특유의 긴장과 해소의 완급 조절을 경험해보는 것만으로도 게임을 구매할 가치가 있지 않을까 싶다.\n\n참고로 SteamDB 기준, 해당 리뷰를 작성하는 2026년 1월 12일에 확인한 최저가는 40% 할인된 38,880원이다. 물론 어떤 게임이든 할인 구매가 이상적이지만, 엘든링은 플레이 목적을 어떻게 잡느냐에 따라 콘텐츠가 자연스럽게 확장되기 때문에 정가에 구매하더라도 충분히 값어치를 하는 게임이라고 말할 수 있다.\n\n\n[도전과제]\n\n난이도 - 中\n필요 회차 - 1회차+\n\n엘든 링의 경우, 몇 가지 주의사항만 알고 세이브 파일 백업 방식을 활용하면 1회차에서도 무난하게 도전과제 올클리어가 가능하다. 그래서 다회차를 돌지 않아도 된다는 큰 이점 때문에 난이도를 중으로 책정했다. 도전과제는 크게 보스 처치, 엔딩, 수집 요소 세 가지로 나눠볼 수 있다. 보스 처치의 경우, 엔딩을 본 이후에도 누락된 친구들을 잡을 수 있어 다회차로 빠질 일이 거의 없는데, 수집 요소와 엔딩은 약간 신경을 써줘야 한다.\n\n우선 수집 요소에서 가장 중요한 주의점은 무너지는 파름 아즈라의 메인 보스를 처치하면 도읍 로데일의 맵 구조가 바뀐다는 점이다. 때문에 지역이 변경되기 전, 반드시 전설 무기 중 하나인 그랑삭스의 벼락을 획득해두어야 한다. 이를 놓치면 강제로 2회차에 돌입해 도읍 로데일까지 다시 진행해야 하므로, 진행 도중 한 번만 체크해두면 불필요한 다회차를 피할 수 있다. 그 외 대부분의 수집 요소는 엔딩 이후에도 획득이 가능하므로, 큰 부담 없이 진행이 가능하다.\n\n세이브 파일 백업을 활용한 방식은 간단하다. 최종 보스를 처치하게 되면 엔딩 선택이 가능한 석상이 있는 곳으로 이동된다. 석상 근처에 있는 축복을 활성화하여 게임을 저장하고, 세이브 파일을 백업해둔다. 이후 첫 번째 엔딩을 감상 → 파일 백업 → 두 번째 엔딩 → 파일 백업 → 세 번째 엔딩 순으로 진행하면, 1회차에 모든 엔딩 도전과제를 달성할 수 있다. 방법이 어렵지 않으니 세이브 파일 백업을 한 번도 안해봤더라도 구글링을 통해 찾아보고 진행하면 쉽게 따라할 수 있다.\n\n\n[총평]\n\n[b]오픈월드와 소울라이크가 적절하게 버무려진 3D 액션 RPG 게임[/b]\n\n소울라이크. 개인적으로 필자는 프롬 소프트웨어의 소울라이크 게임들을 참 좋아한다. 악랄한 난이도가 주는 도전 의식 때문이라기보단, 다크 판타지 세계관의 다양한 맵과 열린 결말같지만 세세하게 짜맞춰진 프롬만의 세계관에 매료되었기 때문이다. 그래서 아이러니하게도, 플레이는 안 해봤지만 비주얼과 스토리에 취향 저격을 당한 블러드본이 인생 최고의 게임이다.\n\n엘든 링 또한 워낙 플레이하길 고대했던 게임이고 인생 게임 중 하나로 찝을만큼 몰입해서 즐겼기에 이 감동을 리뷰로 멋지게 풀어내고 싶었으나... 마음과 달리 머리가 굳었는지 글이 생각보다 딱딱하게 나온 것 같아 진한 아쉬움이 남는다. 사람이 이래서 책을 많이 읽어야 하는데.. 쩝..\n\n뭐, 각설하고 엘든링은 오픈월드라는 새로운 요소를 사용한 프롬사의 첫 작품임을 감안해도 퀄리티 높은 웰메이드 작품이라 생각한다. 높은 자유도 때문에 초반엔 다소 막막할 수 있으나, 다채로운 빌드와 한층 발전된 편의성 덕분에 다크소울 3와 더불어 소울라이크에 입문하고자 하는 게이머에게는 적극 추천하고 싶은 타이틀이다.\n\n해보겠다는 의지만 있으면 정말 재밌게 할 수 있는 게임이니 관심이 있으면 한 번 플레이해보는 걸 추천한다. 다만 전투보다 생동감 넘치고 풍부한 상호작용이 있는 오픈월드를 기대하고 구매했다가는 실망할 수도 있으니, 주의!\n\n\n[추천/비추천 게이머 유형]\n\n추천 게이머 유형\n1. 소울라이크 장르의 게임을 좋아하는 게이머\n2. 다크 판타지 세계관을 좋아하는 게이머\n3. 다양한 빌드를 구축해 플레이하는 걸 좋아하는 게이머\n\n비추천 게이머 유형\n1. 직관적인 스토리 텔링 게임을 선호하는 게이머\n2. 불친절한 게임을 선호하지 않는 게이머\n3. 기괴, 고어, 징그러움에 약한 게이머", "프롬게임 충분히 해봄. 다크소울3 3000시간 등. 할 거 다 해봄. 소위 유튜브에서 나오는 고인물들 정도는 아무것도 아니고 정말 게임에서 해볼거 다 해본 완벽히 모든걸 다 공략한 사람임.\n\n게임 역사상 최악의 쓰레기 같은 든 아득바득 돈 부터 벌려고 하겠지만[strike]필자도 매일같이 돈 번다고 효율표 같은 거 찾으며 게임했다[/strike] 가끔은 유유자적하게 자신의 다양한 가능성을 믿고, 게임을 즐겨보는 것도 좋을 것이다.\n\n[*][b]개성 충만한 캐릭터들[/b]-세심하게 설정되어 있는 스타듀밸리의 캐릭터들은, 각자 좋아하는 것, 싫어하는 것, 말투나 성격, 심지어는 계절과 요일마다 움직이는 패턴이 [b]전부 다르다![/b] 여러분이 마음에 드는 캐릭터도 있을 것이고 [strike]나한테 물건을 사가지고 가서는 더 비싸게 팔아먹는 양아치[/strike] 마음에 들지 않는 녀석도 있을 것이다. 그러나 바로 이 다양성이 게임에 [i]생동감[/i]을 불어넣어주고, 이는 플레이어들이 게임에 자연스럽게 녹아들도록 만들어주는 만족스러운 요소이다.\n\n[*][b]방대한 파고들기 요소[/b]-만일 농사 컨텐츠가 그저 아무 씨를 뿌려서 사계절 내내 자동으로 자라는 작물을 캐는 것이라면 얼마나 지루하고 현학적일까? 스타듀밸리에서는 당신의 선택이 중요하다. 사계절에 따라 키울 수 있는 작물이 다르고, 그 작물이 자라는 기간도 다르며, 그 작물의 품질은 당신이 어떻게 기르느냐에 따라 달라진다. 필자가 말하고 싶은 파고들기 요소는 단순하게는 '빨리 자라는 [i]파스닙[/i]을 심을까? 아니면 좀 느리게 자라도 비싼 [i]콜리플라워[/i]를 심을까?' 부터, 복잡하게는 '[i]마을회관 꾸러미나 축제[/i]를 대비해야 할까? 아니면 [i]돈을 좀 더 많이 모으는 방향[/i]으로 가야할까?' 같은 상황이나 업적에 대한 파고들기 요소로 이어진다. 단순히 '농사'라는 컨텐츠 하나만 놓고도 많은 요소가 있는데, 다른 컨텐츠를 합치면 게임의 볼륨은 더더욱 풍성해진다.\n[/list]\n\n[h3]복합적인 부분[/h3]\n[list]\n[*][b]느?린 게임의 템포, 하지만 빠릿하게 행동해야 한다![/b]-필히 시간이 드는 요소들이 많기 때문에, 한정적인 자원 내에서 해야 하는 일들이 생길 수 밖에 없다. 처음에는 답답하다고 느낄 수 있지만, 심적으로 여유를 갖고 게임을 즐기자. 급할수록 돌아가라고 하지 않던가?\n[/list]\n\n[h3]부정적인 부분[/h3]\n[list]\n[*][b]결국에는 고루고루 진행해야만 하는 스토리[/b]-필자는 처음에는 낚시가 재밌어서 낚시만 했었다. 그리고 곧 강태공이 70세까지 이름을 떨치지 못했던 사실이 생각이 났다. 내가 잡은 물고기들은 내 친구 윌리 빼고는 [b]'아무도'[/b] 관심이 없었다. 돈이 있어도 집을 늘리지도 못하고, 다른 건물을 짓거나 동물을 데려오는 것도 쉽지 않았다. 게임은 어느 시점에는 내가 [b]'일정 수준의 성취도'[/b]에 다다를 것을 요구한다. 필자는 결국 잔혹한 현실에 무릎 꿇었지만, 그렇지 않은 사람들에게는 마음에 들지 않는 요소라 생각된다.\n\n[*][b]갈수록 생기는 반복성의 늪[/b]-1년차 동안, 길게 쳐서 2년차 가을 좀 넘길 때까지는 이것저것 퍼먹으면서 '헤헤 맛있다'하며 머리가 꽃밭인 채로 있었다. 스프링쿨러나 광차, 마법지팡이 등으로 어느 정도 자동화, 빠른 이동이 가능해지지만 결국에 [b]사람 손으로 마무리 지어야 하는 요소들[/b]이 다수 존재하고, 그런 일들을 많이 벌려 놓았다면 하루 진행 루틴이 기하급수적으로 빡빡해진다. 남친/여친은 일하다 바빠서 말 안 걸어주거나 선물 안 주면 삐지고, A를 하느라 B에 신경을 못 쓰는 바람에 큰 그림이 어그러지는 경우도 있다. 결국에는 모든 것이 거대한 시간 낭비처럼 느껴지는 시점이 다가오게 된다.\n[/list]\n\n[h3]총평[/h3]\n필자가 남긴 모든 단점들에도 불구하고, 스타듀밸리는 여전히 좋은 게임이라 생각한다. '아니 그럼 왜 게임 욕해요?'라고 묻는다면, 단점 없는 사람이 세상에 존재할 수 없듯이, 단점 없는 게임도 세상에 존재할 수 없다고 대답해주고 싶다. 스타듀밸리의 단점은 이 게임이 내게 가져다준 산등성이같은 즐거움에 비하면, 아무것도 아니라고 할 수 있다. 나는 아직도 기억한다, 처음으로 전설적인 물고기

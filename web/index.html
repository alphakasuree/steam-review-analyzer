<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>스팀 리뷰 분석</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eff3f7;color:#172936;font:16px/1.6 "Malgun Gothic",sans-serif}main{max-width:1040px;margin:auto;padding:32px 20px}header{background:#16384a;color:white;padding:clamp(22px,4vw,44px);border-radius:18px}h1{font-size:clamp(30px,5vw,48px);margin:0 0 16px}h2{font-size:20px;margin:0 0 12px}form,.filters,.cards{display:flex;gap:12px;flex-wrap:wrap}form input{flex:1;min-width:180px}input,select,button{font:inherit;padding:9px 13px;border:1px solid #bbc9d4;border-radius:8px;background:white;color:#172936}button{cursor:pointer}button:disabled{opacity:.6}header button,button[aria-pressed=true]{background:#9ce5dd;color:#122e34;border-color:transparent}section{background:white;border-radius:14px;padding:22px;margin-top:14px}.cards section{flex:1;min-width:240px}.filters{align-items:center;margin-top:18px}.filters select{margin:4px}button.key{margin:3px}details{padding:12px 0;border-bottom:1px solid #dbe2e8}summary{cursor:pointer}p,summary{overflow-wrap:anywhere}details p{white-space:pre-wrap}small{color:#475c66}#msg{min-height:1.5em;margin-bottom:0}#count{margin-left:auto}</style>
<main><header><h1>스팀 리뷰 분석</h1><form id="form"><input id="address" aria-label="Steam 상점 주소 또는 게임 번호" placeholder="Steam 상점 주소 또는 게임 번호" required><button id="send">리뷰 분석</button></form><p id="msg" role="status">최신 한국어 리뷰를 최대 300개까지 분석합니다.</p></header>
<div class="filters"><label>게임 <select id="game"></select></label><label>카테고리 <select id="cat"></select></label><small id="count"></small></div><div class="cards"><section><h2>장점 키워드</h2><div id="pos"></div></section><section><h2>단점 키워드</h2><div id="neg"></div></section></div><section><h2 id="title">근거 리뷰</h2><div id="quotes"></div><button hidden id="more">더 보기</button></section><small>키워드 옆 숫자는 해당 표현이 나온 서로 다른 리뷰 수입니다. 주제와 긍정·부정은 모델의 예측입니다.</small></main>
<script>
const $=id=>document.getElementById(id),sets=new Map();let items=[],at=0;
function store(d){for(const g of new Set(d.games)){if(!sets.has(g))$('game').add(new Option(g,g));sets.set(g,d)}}
function show(){const d=sets.get($('game').value);for(const [i,s] of items.slice(at,at+12)){const e=document.createElement('details'),summary=document.createElement('summary'),p=document.createElement('p');summary.textContent=s;p.textContent=d.reviews[i];e.append(summary,p);$('quotes').append(e)}at+=12;$('more').hidden=at>=items.length}
function render(){const g=$('game').value,d=sets.get(g);if(!d)return;const c=$('cat').value;$('count').textContent='분석 대상 '+d.games.filter(x=>x===g).length.toLocaleString()+'개';$('title').textContent='근거 리뷰';$('quotes').textContent='키워드를 선택하면 해당 구절과 원문을 볼 수 있습니다.';$('more').hidden=true;
 for(const [id,pol] of [['pos','긍정'],['neg','부정']]){const box=$(id),groups=new Map();box.replaceChildren();for(const [i,s,j,keys] of d.evidence){if(d.games[i]!==g||d.labels[j]!==c+'·'+pol)continue;for(const k of keys){if(!groups.has(k))groups.set(k,new Map());groups.get(k).set(i,s)}}for(const [k,rows] of [...groups].sort((a,b)=>(a[0]==='그 외 표현')-(b[0]==='그 외 표현')||b[1].size-a[1].size).slice(0,5)){const b=document.createElement('button');b.className='key';b.textContent=k+' · '+rows.size;b.onclick=()=>{document.querySelectorAll('.key').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');$('title').textContent=k+' · '+pol+' 근거 리뷰';$('quotes').replaceChildren();items=[...rows];at=0;show()};box.append(b)}if(!groups.size)box.textContent='해당 조건의 예측 결과가 없습니다.'}}
function load(d){store(d);if(!$('cat').length)for(const label of d.labels.filter((_,i)=>i%2===0))$('cat').add(new Option(label.slice(0,-3)));render()}
$('game').onchange=$('cat').onchange=render;$('more').onclick=show;
$('form').onsubmit=async e=>{e.preventDefault();$('send').disabled=true;$('msg').textContent='한국어 리뷰를 수집하고 분석하고 있습니다…';try{const r=await fetch('/analyze?'+new URLSearchParams({game:$('address').value}));const d=await r.json();if(!r.ok)throw Error(d.error);load(d);$('game').value=d.games[0];render();$('msg').textContent=d.reviews.length+'개 리뷰 분석 완료'}catch(err){$('msg').textContent=err.message}finally{$('send').disabled=false}};
fetch('/demo').then(r=>r.json()).then(load).catch(()=>{$('msg').textContent='기본 게임을 불러오지 못했습니다. 상점 주소로 분석을 시작하세요.'});
</script></html>
